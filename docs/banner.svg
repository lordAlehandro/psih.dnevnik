<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1526"/>
      <stop offset="1" stop-color="#2d2142"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b79cf0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#b79cf0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fd1c7" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7fd1c7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="260" fill="url(#glow1)"/>
  <circle cx="180" cy="340" r="220" fill="url(#glow2)"/>

  <!-- mood scale -->
  <g transform="translate(860 150)" font-size="54" font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji, sans-serif">
    <text x="0" y="0" opacity="0.35">😢</text>
    <text x="72" y="0" opacity="0.5">😕</text>
    <text x="144" y="0" opacity="0.7">😐</text>
    <text x="216" y="0" opacity="0.85">🙂</text>
    <text x="288" y="0">😊</text>
  </g>
  <g transform="translate(860 200)">
    <rect width="340" height="10" rx="5" fill="#ffffff" opacity="0.08"/>
    <rect width="300" height="10" rx="5" fill="#c9b3f5"/>
    <circle cx="300" cy="5" r="12" fill="#e4d7ff"/>
  </g>

  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="150" font-size="76" font-weight="700" fill="#efe7ff">Дневник КПТ</text>
    <text x="84" y="200" font-size="30" fill="#c9b3f5">CBT Diary · emotions, mood &amp; self-tests</text>
    <text x="84" y="268" font-size="24" fill="#a99cc0">Замечайте эмоции. Понимайте мысли. Меняйте реакции.</text>
  </g>
</svg>
